    showOrder(o);
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'order/' + id);
    if (ordHere()) view('<div class="wrap page">' + errorBox(e.message || 'We could not load your order.', true) + '</div>');
  }
};

/* ---------- the page ---------- */
function showOrder(o) {
  if (!ordHere() && App.route.seg[0] !== 'order') return;
  clearInterval(ORD.poll); ORD.o = o; ORD.sig = ordSig(o);
  App.orderCache[o.id] = { order: o, t: Date.now() };
  const note = ordNote(o);
  view('<div class="wrap page ord"><a class="back" href="#/orders">← My orders</a>' +
    '<div class="ord-head"><div><h1>Order ' + esc(o.id) + '</h1><p class="meta">Placed ' + esc(fmtDate(o.createdAt)) + ' · ' + esc(o.paymentMethod) + '</p></div><div class="pills">' + payPill(o) + deliveryPill(o) + '</div></div>' +
    '<div class="alert ' + note.kind + '" role="status">' + esc(note.text) + '</div><div id="ord-alert"></div>' +
    '<div class="ord-grid"><div class="ord-main">' + payPanel(o) + progressCard(o) + '</div><aside class="ord-side">' + itemsCard(o) + shipCard(o) + actionsCard(o) + '</aside></div></div>');
  mountPay(o); startOrderRefresh(o);
  if (o.ship && goodPin(o.ship.lat, o.ship.lng)) showMiniMap('ord-map', Number(o.ship.lat), Number(o.ship.lng));
}

function ordNote(o) {
  const ps = o.paymentStatus, ds = o.deliveryStatus, eta = o.dueBy ? fmtDate(o.dueBy) : '';
  if (ps === 'Awaiting payment') return { kind: 'warn', text: 'Your order is saved but not paid yet. Finish your payment below to confirm it. ' + (o.paymentMethod === 'Bank transfer' ? 'Unpaid bank orders are cancelled after 24 hours.' : 'Unpaid orders are cancelled after 3 hours.') };
  if (ps === 'Payment submitted') return { kind: '', text: 'Thank you. We have your payment details and we are checking them. We usually confirm within a few hours.' };
  if (ps === 'Failed') return { kind: 'err', text: 'The payment did not go through, so this order was not confirmed. You can place a new order from your cart.' };
  if (ps === 'Cancelled' || ds === 'Cancelled') return { kind: 'err', text: 'This order was cancelled.' };
  if (ps === 'Refunded') return { kind: '', text: 'This order was refunded. The money is on its way back to you.' };
  if (ds === 'Returned') return { kind: '', text: 'This order was returned.' };
  if (ds === 'Delivered') return { kind: 'ok', text: 'Delivered. Thank you for shopping with us!' };
  if (ds === 'Out for delivery') return { kind: 'ok', text: 'Your order is on its way to you.' + (eta ? ' Expected by ' + eta + '.' : '') };
  return { kind: 'ok', text: 'Payment received. We are preparing your order.' + (eta ? ' Expected delivery by ' + eta + '.' : '') };
}

/* ---------- progress ---------- */
function progressCard(o) {
  const ps = o.paymentStatus, ds = o.deliveryStatus, dead = ps === 'Failed' || ps === 'Cancelled' || ds === 'Cancelled' || ds === 'Returned' || ps === 'Refunded';
  const paid = ps === 'Paid' || ps === 'Refunded';
  const st = [
    ['Order placed', true],
    [ps === 'Payment submitted' ? 'Payment check' : 'Paid', paid],
    ['Preparing', ds === 'Processing' || ds === 'Out for delivery' || ds === 'Delivered'],
    ['On the way', ds === 'Out for delivery' || ds === 'Delivered'],
    ['Delivered', ds === 'Delivered']
  ];
  let cur = st.findIndex(s => !s[1]); if (cur < 0) cur = st.length;
  const steps = dead ? '' : '<ol class="ostep">' + st.map((s, i) => '<li class="' + (s[1] ? 'done' : i === cur ? 'cur' : '') + '"><span class="dot">' + (s[1] ? '✓' : i + 1) + '</span><span class="lbl">' + esc(s[0]) + '</span></li>').join('') + '</ol>';
  const ev = (o.events || []).slice().reverse().map(e => '<li><time>' + esc(fmtDate(e.at)) + '</time><span>' + esc(e.text) + '</span></li>').join('');
  const track = o.trackingNo ? '<p class="trackno">Tracking number: <b>' + esc(o.trackingNo) + '</b> <button type="button" class="linkbtn" data-act="copy" data-v="' + esc(o.trackingNo) + '">Copy</button></p>' : '';
  return '<section class="card"><h2>Progress</h2>' + steps + track + (ev ? '<ul class="tl">' + ev + '</ul>' : '') + '</section>';
}

/* ---------- side cards ---------- */
function itemsCard(o) {
  const rows = (o.items || []).map(i => '<li>' + (i.image ? '<img src="' + esc(sized(i.image, 120)) + '" alt="" loading="lazy" width="48" height="48">' : '<span class="noimg"></span>') +
    '<span class="nm">' + esc(i.name) + '<small> × ' + esc(i.qty) + '</small></span><span>' + esc(omoney(o, i.price * i.qty)) + '</span></li>').join('');
  return '<section class="card"><h2>Your items</h2><ul class="olist">' + rows + '</ul><div class="row"><span>Delivery</span><span class="free">Free</span></div><div class="row total"><span>Total</span><span>' + esc(omoney(o, o.total)) + '</span></div>' + (hasReceipt(o) ? '<a class="btn btn-ghost btn-block" style="margin-top:14px" href="#/receipt/' + encodeURIComponent(o.id) + '">View receipt</a>' : '') + '</section>';
}
function shipCard(o) {
  const s = o.ship || {}, map = goodPin(s.lat, s.lng) ? '<p><a href="https://www.openstreetmap.org/?mlat=' + encodeURIComponent(Number(s.lat)) + '&mlon=' + encodeURIComponent(Number(s.lng)) + '#map=16/' + encodeURIComponent(Number(s.lat)) + '/' + encodeURIComponent(Number(s.lng)) + '" target="_blank" rel="noopener">See my pin on the map</a></p>' : '';
  return '<section class="card"><h2>Delivery to</h2>' + (goodPin(s.lat, s.lng) ? '<div class="map small" id="ord-map" role="img" aria-label="Map of your delivery pin"></div>' : '') + '<p class="addr"><b>' + esc(s.name) + '</b><br>' + esc(s.address) + '<br>' + esc([s.city, s.country].filter(Boolean).join(', ')) + '<br>' + esc(s.phone) + '</p>' +
    (s.note ? '<p class="meta">Note: ' + esc(s.note) + '</p>' : '') + map + '<p class="meta">Free delivery within ' + esc(deliveryHours()) + ' hours of payment.</p></section>';
}
function actionsCard(o) {
  let h = '';
  if (o.returnStatus) h += '<p class="alert">Return or refund request: <b>' + esc(o.returnStatus) + '</b>. We will keep you updated here.</p>';
  if (o.canReturn && (!o.returnStatus || o.returnStatus === 'Rejected')) h += '<button class="btn btn-ghost btn-block" type="button" data-act="oreturn">Return or refund this order</button>';
  if (o.canCancel) h += '<button class="btn btn-ghost btn-block" type="button" data-act="ocancel">Cancel this order</button>';
  h += '<button class="btn btn-ghost btn-block" type="button" data-act="support" data-order="' + esc(o.id) + '">Message us about this order</button>';
  return '<section class="card ord-act"><h2>Need help?</h2>' + h + '</section>';
}

/* ---------- payment panel ---------- */
function payPanel(o) {
  const ps = o.paymentStatus, m = o.paymentMethod;
  if (ps === 'Awaiting payment') {
    if (m === 'PayPal') return '<section class="card" id="ord-pay"><h2>' + payBadge('PayPal', 1) + 'Pay now</h2><p class="meta">Pay with PayPal or a debit or credit card. You are charged <b>' + esc(usd(o.total)) + '</b>.</p><div id="pp-box"><div id="pp-btns"><p class="meta">Loading the payment buttons…</p></div></div></section>';
    if (m === 'Bank transfer') return '<section class="card" id="ord-pay"><h2>' + payBadge('Bank transfer', 1) + 'Pay by bank transfer</h2>' + bankHtml(o) + bankForm(false) + '</section>';
    if (m === 'M-Pesa') return '<section class="card" id="ord-pay"><h2>' + payBadge('M-Pesa', 1) + 'Pay with M-Pesa</h2>' + mpesaHtml(o) + '</section>';
    if (m === 'Paystack') return '<section class="card" id="ord-pay"><h2>' + payBadge('Paystack', 1) + 'Pay by card</h2>' + paystackHtml(o) + '</section>';
  }
  if (ps === 'Payment submitted' && m === 'Bank transfer') {
    return '<section class="card" id="ord-pay"><h2>Payment details sent</h2><p>Your reference: <b>' + esc(o.paymentRef || '') + '</b></p><p class="meta">We are checking our bank account. We will tell you here and by email when it is confirmed.</p>' +
      '<details class="more"><summary>Sent the wrong reference? Send it again</summary>' + bankHtml(o) + bankForm(true) + '</details></section>';
  }
  return '';
}

function money2(cur, n) { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(n); } catch (e) { return cur + ' ' + n; } }
function copyRow(label, v) { return v === '' || v == null ? '' : '<div class="bk"><span>' + esc(label) + '</span><b>' + esc(v) + '</b><button type="button" class="linkbtn" data-act="copy" data-v="' + esc(v) + '">Copy</button></div>'; }
function bankHtml(o) {
  const b = o.bank; if (!b) return '<p class="alert warn">The bank details are not available right now. Please message us.</p>';
  return '<p class="meta">Send exactly this amount, then tell us below.</p><div class="bank">' +
    copyRow('Bank', b.bankName) + copyRow('Account name', b.accountName) + copyRow('Account number', b.accountNumber) + copyRow(/^[A-Za-z]{6}/.test(b.codeOrSwift || '') ? 'SWIFT code' : 'Bank code', b.codeOrSwift) +
    copyRow('Amount', money2(b.currency || 'USD', b.amount)) + copyRow('Payment reference', b.reference) + '</div>' +
    (b.instructions ? '<p class="meta">' + esc(b.instructions) + '</p>' : '') + '<p class="meta">Please type the reference <b>' + esc(b.reference) + '</b> in the transfer, so we can find your payment.</p>';
}
function bankForm(again) {
  return '<form id="bk-form" novalidate><h3>' + (again ? 'Send new details' : 'I have paid') + '</h3><div id="bk-alert"></div>' +
    fld('bk-ref', 'Transaction reference from your bank or app', { req: 1, max: 80, hint: 'For example the code in your bank message.' }) +
    fld('bk-note', 'Note for us', { area: 1, rows: 2, max: 300 }) +
    '<div class="field" id="f-bk-proof"><label for="bk-proof">Photo of your receipt <span class="opt">(optional)</span></label><input type="file" id="bk-proof" accept="image/*"><span class="hint">A screenshot or photo helps us confirm faster.</span><span class="err" id="bk-proof-e" role="alert"></span></div>' +
    '<button class="btn btn-tape btn-block" type="submit">I have paid – tell the shop</button></form>';
}
function mpesaHtml(o) {
  const kes = o.mpesa && o.mpesa.amountKes != null ? o.mpesa.amountKes : '';
  const ph = (o.ship && o.ship.phone) || (App.user && App.user.phone) || '';
  return '<p class="meta">You will get a pop-up on your phone asking for your M-Pesa PIN. Amount: <b>' + esc(kesText(kes !== '' ? kes : kesOf(o.total))) + '</b>.</p><div id="mp-alert"></div>' +
    '<form id="mp-form" novalidate>' + fld('mp-phone', 'M-Pesa phone number', { type: 'tel', ac: 'tel', im: 'tel', req: 1, value: ph, hint: 'Example: 0712 345 678' }) +
    '<button class="btn btn-tape btn-block" id="mp-go" type="submit">Send the M-Pesa prompt</button></form><div id="mp-wait"></div>';
}

/* ---------- start the payment parts after the page is drawn ---------- */
function mountPay(o) {
  if (o.paymentStatus !== 'Awaiting payment' && !(o.paymentStatus === 'Payment submitted' && o.paymentMethod === 'Bank transfer')) return;
  if (o.paymentMethod === 'PayPal' && o.paymentStatus === 'Awaiting payment') mountPayPal(o);
  const bf = $('#bk-form'); if (bf) bf.addEventListener('submit', bankSend);
  const mf = $('#mp-form'); if (mf) mf.addEventListener('submit', mpesaSend);
  if (o.paymentMethod === 'Paystack' && o.paymentStatus === 'Awaiting payment') {
    const pr = App.psReturn;
    if (pr && String(pr.id).toUpperCase() === String(o.id).toUpperCase()) { App.psReturn = null; ORD.psAuto = o.id; psConfirm(o, pr.reference); }   // the customer just came back from Paystack
    else if (o.paystack && o.paystack.hasPayment && ORD.psAuto !== o.id) { ORD.psAuto = o.id; psQuiet(o); }                                                // opened later: look quietly whether it went through
  }
}

/* PayPal */
async function mountPayPal(o) {
  const box = $('#pp-btns'); if (!box) return;
  const pp = (App.cfg && App.cfg.payments && App.cfg.payments.paypal) || {};
  if (!pp.enabled || !pp.clientId) { box.innerHTML = '<p class="alert warn">PayPal is not available right now. Please message us and we will help.</p>'; return; }
  if (ORD.ppDone) { ppRetryBox(); return; }
  try {
    await loadScript('https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(pp.clientId) + '&currency=USD&intent=capture&components=buttons');
    if (!$('#pp-btns') || ORD.o !== o) return;
    if (!window.paypal || !window.paypal.Buttons) throw new Error('PayPal did not start');
    let shown = false;
    window.paypal.Buttons({
      style: { layout: 'vertical', shape: 'rect', color: 'blue', label: 'pay', height: 46 },
      createOrder: async () => {
        showAlert('ord-alert', '');
        try { const r = await api('paypalCreate', { orderId: o.id }); return r.paypalOrderId; }
        catch (e) { shown = true; if (e.code === 'AUTH') handleErr(e, 'order/' + o.id); else showAlert('ord-alert', e.message); throw e; }
      },
      onApprove: data => ppCapture(o, data.orderID),
      onCancel: () => showAlert('ord-alert', 'You closed PayPal before paying. Your order is still waiting. You can try again below.', 'warn'),
      onError: () => { if (shown) { shown = false; return; } showAlert('ord-alert', 'PayPal had a problem. Please try again. If money left your account, press "Check my payment" or message us.'); }
    }).render('#pp-btns');
  } catch (e) {
    const b = $('#pp-btns'); if (b) b.innerHTML = '<p class="alert err">We could not load PayPal. Please check your internet and <button type="button" class="linkbtn" data-act="reload">try again</button>.</p>';
  }
}
async function ppCapture(o, ppId) {
  ORD.ppDone = ppId;
  const box = $('#pp-box'); if (box) box.innerHTML = '<p class="working"><span class="spin"></span> Confirming your payment. Please do not close this page…</p>';
  try {
    const r = await api('paypalCapture', { orderId: o.id, paypalOrderId: ppId });
    ORD.ppDone = ''; toast('Payment received. Thank you!');
    showOrder(r.order); window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'order/' + o.id);
    if (!ordHere()) return;
    showAlert('ord-alert', e.message);
    ppRetryBox();
  }
}
function ppRetryBox() {
  const box = $('#pp-box'); if (!box) return;
  box.innerHTML = '<p class="meta">We could not confirm your payment yet. If PayPal took the money, press the button and we will check again. You will not be charged twice.</p><button class="btn btn-block" type="button" data-act="ppcheck">Check my payment</button>';
}
App.actions.ppcheck = async el => {
  if (!ORD.ppDone || !ORD.o) return;
  await busy(el, 'Checking…', () => ppCapture(ORD.o, ORD.ppDone));
};

/* Paystack (card): the customer pays on Paystack's own page and comes back here */
function paystackHtml(o) {
  const p = o.paystack || {}, c = String(p.currency || ''), amt = p.amount != null && c ? (c === 'USD' ? usd(p.amount) : c + ' ' + Math.round(p.amount).toLocaleString('en-US')) : orderPayText(o, o.total);
  return '<p class="meta">You will pay on Paystack’s secure page. Amount: <b>' + esc(amt) + '</b>.</p>' + cardChips() + '<div id="ps-alert"></div>' +
    '<button class="btn btn-tape btn-block" id="ps-go" type="button" data-act="pspay" style="margin-top:12px">Pay ' + esc(amt) + '</button><div id="ps-wait"></div>' +
    (p.hasPayment ? '<button class="btn btn-ghost btn-block" type="button" data-act="pscheck" style="margin-top:10px">I already paid – check my payment</button>' : '');
}
App.actions.pspay = async el => {
  const o = ORD.o; if (!o) return; showAlert('ps-alert', '');
  try {
    const r = await busy(el, 'Opening Paystack…', () => api('paystackStart', { orderId: o.id, returnUrl: location.origin + location.pathname }));
    if (r.status === 'paid') { toast('Payment received. Thank you!'); if (r.order) showOrder(r.order); else await reloadOrder(); return; }
    if (!r.url || !/^https:\/\/[a-z0-9-]+\.paystack\.(com|co)\//i.test(r.url)) throw new Error('Paystack did not give us a payment page. Please try again.');
    store('gbs_ps', { id: o.id, t: Date.now() });
    el.disabled = true; el.textContent = 'Opening Paystack…';
    location.href = r.url;
  } catch (e) { if (e.code === 'AUTH') handleErr(e, 'order/' + o.id); else showAlert('ps-alert', e.message); }
};
// ask the shop whether Paystack really took the money (it asks Paystack itself); keeps asking for a short while
async function psConfirm(o, reference, manual) {
  const box = $('#ps-wait'); if (box) box.innerHTML = '<p class="working"><span class="spin"></span> Confirming your payment with Paystack. Please do not close this page…</p>';
  const go = $('#ps-go'); if (go) go.disabled = true;
  const t0 = Date.now();
  for (;;) {
    let r;
    try { r = await api('paystackVerify', { orderId: o.id, reference: reference || '' }); }
    catch (e) { if (e.code === 'AUTH') return handleErr(e, 'order/' + o.id); if (ordHere()) psAgain(e.message, 'err', true); return; }
    if (!ordHere()) return;
    if (r.status === 'paid') { toast('Payment received. Thank you!'); if (r.order) showOrder(r.order); else await reloadOrder(); return; }
    if (r.status === 'review') { toast('We received your payment and are checking it.'); if (r.order) showOrder(r.order); else await reloadOrder(); return; }
    if (r.status === 'failed') { psAgain('The payment was not completed. You can try again.', 'err'); return; }
    if (r.status === 'none' || manual || Date.now() - t0 > 45000) {
      psAgain(r.status === 'none' ? 'We have not seen a card payment for this order yet. You can pay now.' : 'Paystack has not confirmed a payment yet. If you already paid, wait a minute and press "I already paid". If you did not, you can pay again.', 'warn', r.status !== 'none'); return;
    }
    await new Promise(res => setTimeout(res, 3000)); if (!ordHere()) return;
  }
}
async function psQuiet(o) {
  try { const r = await api('paystackVerify', { orderId: o.id }); if (!ordHere()) return; if (r.status === 'paid' && r.order) { toast('Payment received. Thank you!'); showOrder(r.order); } } catch (e) { /* the page still works; the customer can press "I already paid" */ }
}
function psAgain(msg, kind, check) {
  const w = $('#ps-wait'); if (w) w.innerHTML = '';
  showAlert('ps-alert', msg, kind === 'warn' ? 'warn' : 'err');
  const b = $('#ps-go'); if (b) { b.disabled = false; }
  if (check && w) w.innerHTML = '<button class="btn btn-ghost btn-block" type="button" data-act="pscheck" style="margin-top:10px">I already paid – check my payment</button>';
}
App.actions.pscheck = async el => { const o = ORD.o; if (o) { showAlert('ps-alert', ''); await psConfirm(o, '', true); } };
// back from Paystack: the address ends in ?reference=GBS-ORD-1001-xxxx -> open that order and confirm the payment
function psReturnFromUrl() {
  try {
    const q = new URLSearchParams(location.search), ref = q.get('reference') || q.get('trxref') || '', m = ref.match(/^GBS-(.+)-[A-Za-z0-9]+$/);
    if (!m) return;
    App.psReturn = { id: m[1].toUpperCase(), reference: ref };
    history.replaceState(null, '', location.pathname + '#/order/' + encodeURIComponent(m[1].toUpperCase()));
  } catch (e) { /* ignore */ }
}

/* bank transfer */
async function bankSend(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f), o = ORD.o; clearErrors(f); showAlert('bk-alert', '');
  const ref = val('bk-ref'); if (ref.length < 3) { fieldError('bk-ref', 'Please type the reference from your bank or app (at least 3 characters).'); return focusFirstBad(f); }
  try {
    const file = $('#bk-proof').files[0];
    await busy(btn, 'Sending…', async () => {
      const payload = { orderId: o.id, reference: ref, note: val('bk-note') };
      if (file) payload.proofDataUrl = await resizeImage(file, 1400, 1100 * 1024, 0.8);
      const r = await api('bankSubmit', payload);
      toast('Thank you. We will confirm your payment soon.'); showOrder(r.order); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'order/' + o.id);
    if ($('#bk-alert')) showAlert('bk-alert', e.message);
  }
}

/* M-Pesa */
async function mpesaSend(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('#mp-go'), o = ORD.o; clearErrors(f); showAlert('mp-alert', '');
  const phone = val('mp-phone');
  if (phone.replace(/\D/g, '').length < 9) { fieldError('mp-phone', 'Please enter your M-Pesa phone number.'); return focusFirstBad(f); }
  try {
    const r = await busy(btn, 'Sending…', () => api('mpesaStk', { orderId: o.id, phone: phone }));
    btn.disabled = true;
    $('#mp-wait').innerHTML = '<p class="working"><span class="spin"></span> ' + esc(r.message || 'Check your phone and enter your M-Pesa PIN.') + '</p>';
    pollMpesa(o);
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'order/' + o.id);
    showAlert('mp-alert', e.message);
  }
}
function pollMpesa(o) {
  clearInterval(ORD.poll);
  const t0 = Date.now(); let inflight = false;
  const stop = () => clearInterval(ORD.poll);
  const tick = async () => {
    if (inflight) return;
    if (!ordHere() || !$('#mp-wait')) return stop();
    inflight = true;
    try {
      const r = await api('mpesaStatus', { orderId: o.id });
      if (!ordHere()) return stop();
      if (r.status === 'paid') {
        stop(); toast('Payment received. Thank you!');
        if (r.order) showOrder(r.order); else await reloadOrder();
        return;
      }
      if (r.status === 'failed') { stop(); mpesaAgain(r.message || 'The payment was not completed. You can try again.', 'err'); return; }
      if (Date.now() - t0 > 90000) { stop(); mpesaAgain('We have not seen the payment yet. If you already paid, wait a minute and press "Check again". Otherwise send the prompt again.', 'warn', true); }
    } catch (e) {
      stop(); if (e.code === 'AUTH') handleErr(e, 'order/' + o.id); else mpesaAgain(e.message, 'err', true);
    } finally { inflight = false; }
  };
  ORD.poll = setInterval(tick, 4000); App.timers.push(ORD.poll);
}
function mpesaAgain(msg, kind, check) {
  const w = $('#mp-wait'); if (w) w.innerHTML = '';
  showAlert('mp-alert', msg, kind === 'warn' ? 'warn' : 'err');
  const b = $('#mp-go'); if (b) { b.disabled = false; b.textContent = 'Send the prompt again'; }
  if (check && w) w.innerHTML = '<button class="btn btn-ghost btn-block" type="button" data-act="mpcheck" style="margin-top:10px">Check again</button>';
}
App.actions.mpcheck = async el => {
  const o = ORD.o; if (!o) return;
  try {
    const r = await busy(el, 'Checking…', () => api('mpesaStatus', { orderId: o.id }));
    if (r.status === 'paid') { toast('Payment received. Thank you!'); if (r.order) showOrder(r.order); else await reloadOrder(); }
    else showAlert('mp-alert', r.status === 'failed' ? (r.message || 'The payment was not completed.') : 'Not paid yet. Please wait a little and check again.', r.status === 'failed' ? 'err' : 'warn');
  } catch (e) { if (e.code === 'AUTH') handleErr(e, 'order/' + o.id); else showAlert('mp-alert', e.message); }
};

/* ---------- reload and keep fresh ---------- */
async function reloadOrder() {
  const r = await api('myOrders');
  const o = (r.orders || []).find(x => String(x.id).toUpperCase() === ORD.id);
  if (o && ordHere()) showOrder(o);
  return o;
}
// while the order is not finished, look for changes now and then (the shop may confirm payment or send it out)
function startOrderRefresh(o) {
  if (ORD_FINAL.indexOf(o.deliveryStatus) >= 0 || o.paymentStatus === 'Failed' || o.paymentStatus === 'Cancelled' || o.paymentStatus === 'Refunded') return;
  const t = setInterval(async () => {
    if (!ordHere()) return clearInterval(t);
    if (document.hidden || $('#modal') || $('#mp-wait .working') || ORD.ppDone) return;
    const a = document.activeElement; if (a && $('#ord-pay') && $('#ord-pay').contains(a) && /INPUT|TEXTAREA/.test(a.tagName)) return;
    try {
      const r = await api('myOrders'); if (!ordHere()) return;
      const n = (r.orders || []).find(x => String(x.id).toUpperCase() === ORD.id);
      if (n && ordSig(n) !== ORD.sig) { showOrder(n); toast('Your order was updated.'); }
    } catch (e) { if (e.code === 'AUTH') clearInterval(t); }
  }, 60000);
  App.timers.push(t);
}

/* ---------- cancel and return ---------- */
App.actions.ocancel = async el => {
  const o = ORD.o; if (!o) return;
  if (!(await confirmBox('Cancel this order?', 'Order ' + o.id + ' will be cancelled. This cannot be undone.', 'Yes, cancel it'))) return;
  try {
    const r = await busy(el, 'Cancelling…', () => api('cancelOrder', { orderId: o.id }));
    toast('Your order was cancelled.'); showOrder(r.order);
  } catch (e) { if (e.code === 'AUTH') handleErr(e, 'order/' + o.id); else showAlert('ord-alert', e.message); }
};
App.actions.oreturn = () => {
  const o = ORD.o; if (!o) return;
  const delivered = o.deliveryStatus === 'Delivered', days = Number(setting('returnDays', 7)) || 7;
  openModal('Return or refund', '<form id="rt-form" novalidate><div id="rt-alert"></div>' +
    '<p class="meta">' + (delivered ? 'You can ask for a return or a refund within ' + days + ' days of delivery.' : 'Your order has not been delivered yet, so you can ask for a refund.') + '</p>' +
    fld('rt-type', 'What do you want?', { req: 1, select: (delivered ? '<option value="Return">Return the items</option>' : '') + '<option value="Refund">' + (delivered ? 'Get my money back' : 'Refund (cancel the delivery)') + '</option>' }) +
    fld('rt-reason', 'Tell us why', { area: 1, rows: 4, req: 1, max: 600, hint: 'A few words is enough.' }) +
    '<button class="btn btn-block" type="submit">Send my request</button></form>',
    () => $('#rt-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const f = ev.target, btn = $('button[type=submit]', f); clearErrors(f); showAlert('rt-alert', '');
      const reason = val('rt-reason'); if (reason.length < 5) { fieldError('rt-reason', 'Please tell us why (at least 5 letters).'); return focusFirstBad(f); }
      try {
        await busy(btn, 'Sending…', () => api('requestReturn', { orderId: o.id, type: val('rt-type'), reason: reason }));
        closeModal(); toast('Request sent. We will reply here and by email.'); await reloadOrder();
      } catch (e) { if (e.code === 'AUTH') { closeModal(); handleErr(e, 'order/' + o.id); } else showAlert('rt-alert', e.message); }
    }));
};

App.keepOnRefresh.orders = true; App.keepOnRefresh.track = true; App.keepOnRefresh.notifications = true;
const OL = { all: [], f: 'all' };
const loadingBox = '<div class="wrap page"><div class="skel ln" style="height:34px;width:50%"></div><div class="skel sq" style="margin-top:16px;aspect-ratio:4/1"></div><div class="skel sq" style="margin-top:12px;aspect-ratio:4/1"></div></div>';

/* ---------- My orders ---------- */
const OL_FILTERS = [
  ['all', 'All', () => true],
  ['pay', 'To pay', o => o.paymentStatus === 'Awaiting payment' || o.paymentStatus === 'Payment submitted'],
  ['active', 'In progress', o => o.paymentStatus === 'Paid' && ['Pending', 'Processing', 'Out for delivery'].indexOf(o.deliveryStatus) >= 0],
  ['done', 'Delivered', o => o.deliveryStatus === 'Delivered'],
  ['closed', 'Cancelled', o => ['Cancelled', 'Failed', 'Refunded'].indexOf(o.paymentStatus) >= 0 || ['Cancelled', 'Returned'].indexOf(o.deliveryStatus) >= 0]
];

App.routes.orders = async function () {
  setTitle('My orders');
  if (!requireLogin('orders')) return;
  view(loadingBox);
  try {
    const r = await api('myOrders');
    if (App.route.seg[0] !== 'orders') return;
    // newest first (orders made in the same second are told apart by their number)
    const num = o => parseInt(String(o.id).replace(/\D/g, ''), 10) || 0;
    OL.all = (r.orders || []).slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0) || num(b) - num(a)); OL.f = 'all';
    OL.all.forEach(o => { App.orderCache[o.id] = { order: o, t: Date.now() }; });
    renderOrders();
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'orders');
    if (App.route.seg[0] === 'orders') view('<div class="wrap page">' + errorBox(e.message || 'We could not load your orders.', true) + '</div>');
  }
};

function orderCard(o) {
  const imgs = (o.items || []).slice(0, 3).map(i => i.image ? '<img src="' + esc(sized(i.image, 120)) + '" alt="" loading="lazy" width="48" height="48">' : '<span class="noimg"></span>').join('');
  const more = (o.items || []).length > 3 ? '<span class="more">+' + ((o.items || []).length - 3) + '</span>' : '';
  const names = (o.items || []).map(i => i.name).join(', ');
  const pay = o.paymentStatus === 'Awaiting payment';
  return '<article class="oc"><div class="oc-top"><div><a class="oc-id" href="#/order/' + encodeURIComponent(o.id) + '">' + esc(o.id) + '</a><div class="meta">' + esc(fmtDate(o.createdAt, { day: 'numeric', month: 'short', year: 'numeric' })) + ' · ' + esc(o.paymentMethod) + '</div></div><div class="pills">' + payPill(o) + deliveryPill(o) + '</div></div>' +
    '<div class="oc-items">' + imgs + more + '<span class="oc-names">' + esc(names) + '</span></div>' +
    (o.returnStatus ? '<p class="meta" style="margin:0 0 8px">Return or refund request: <b>' + esc(o.returnStatus) + '</b></p>' : '') +
    '<div class="oc-bot"><span><b>' + esc(omoney(o, o.total)) + '</b> <span class="meta">· ' + esc(plural(o.itemCount || (o.items || []).length, 'item', 'items')) + '</span></span><span class="oc-btns">' + (hasReceipt(o) ? '<a class="btn btn-sm btn-ghost" href="#/receipt/' + encodeURIComponent(o.id) + '">Receipt</a>' : '') + '<a class="btn btn-sm ' + (pay ? 'btn-tape' : 'btn-ghost') + '" href="#/order/' + encodeURIComponent(o.id) + '">' + (pay ? 'Pay now' : 'View order') + '</a></span></div></article>';
}

function renderOrders() {
  const all = OL.all;
  if (!all.length) { view('<div class="wrap page"><h1>My orders</h1><div class="empty"><h2>No orders yet</h2><p>When you place an order, it shows up here so you can pay, track and manage it.</p><a class="btn" href="#/shop">Start shopping</a></div></div>'); return; }
  const chips = OL_FILTERS.map(f => ({ id: f[0], name: f[1], n: all.filter(f[2]).length })).filter(c => c.id === 'all' || c.n > 0 || c.id === OL.f);
  const cur = OL_FILTERS.find(f => f[0] === OL.f) || OL_FILTERS[0], list = all.filter(cur[2]);
  view('<div class="wrap page"><h1>My orders</h1><p class="meta" style="margin:4px 0 14px">' + esc(plural(all.length, 'order', 'orders')) + '. Need help? <button type="button" class="linkbtn" data-act="support">Message us</button>.</p>' +
    (chips.length > 2 ? '<div class="chips" role="tablist">' + chips.map(c => '<button type="button" class="chip' + (c.id === OL.f ? ' on' : '') + '" data-act="ofilter" data-f="' + c.id + '">' + esc(c.name) + ' <span>' + c.n + '</span></button>').join('') + '</div>' : '') +
    '<div class="olistc">' + (list.length ? list.map(orderCard).join('') : '<div class="empty"><h2>Nothing here</h2><p>No orders in this group.</p></div>') + '</div></div>');
}
App.actions.ofilter = el => { OL.f = el.dataset.f; renderOrders(); };

/* ---------- Track an order ---------- */
App.routes.track = function (rest, params) {
  setTitle('Track an order');
  const id = String(params.id || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 30), email = (App.user && App.user.email) || store('gbs_email') || '';
  view('<div class="wrap page"><div class="auth card"><h1>Track an order</h1><p class="lead muted">Type your order number and the email you used when you ordered. You do not need to sign in.</p>' +
    '<div id="tr-alert"></div><form id="tr-form" novalidate>' + fld('tr-id', 'Order number', { req: 1, max: 30, ph: 'ORD-1001', extra: ' autocapitalize="characters" spellcheck="false"', value: id }) +
    fld('tr-email', 'Email address', { type: 'email', req: 1, ac: 'email', im: 'email', value: email, extra: ' autocapitalize="off" spellcheck="false"' }) +
    '<button class="btn btn-tape btn-block btn-lg" type="submit">Track my order</button></form></div><div id="tr-out"></div></div>');
  $('#tr-form').addEventListener('submit', trackSubmit);
  if (id && email) $('#tr-form').requestSubmit();
};

async function trackSubmit(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f); clearErrors(f); showAlert('tr-alert', ''); $('#tr-out').innerHTML = '';
  const id = val('tr-id').toUpperCase(), email = val('tr-email').toLowerCase(); let bad = false;
  if (id.length < 3) { fieldError('tr-id', 'Please type your order number.'); bad = true; }
  if (!validEmail(email)) { fieldError('tr-email', 'Please enter a valid email address.'); bad = true; }
  if (bad) return focusFirstBad(f);
  try {
    const r = await busy(btn, 'Looking…', () => api('trackOrder', { orderId: id, email: email }));
    if (App.route.seg[0] !== 'track') return;
    store('gbs_email', email); $('#tr-out').innerHTML = trackResult(r.order); $('#tr-out').scrollIntoView({ block: 'start', behavior: 'smooth' });
  } catch (e) { showAlert('tr-alert', e.message); }
}

function trackResult(o) {
  const n = ordNote(o), mine = App.user && o.clientId && o.clientId === App.user.id;
  if (o.paymentStatus === 'Awaiting payment') n.text = 'This order is not paid yet. Sign in with the email used on the order to pay for it.';
  const s = o.ship || {};
  const items = (o.items || []).map(i => '<li><span class="nm">' + esc(i.name) + '<small> × ' + esc(i.qty) + '</small></span></li>').join('');
  const open = mine ? '<a class="btn btn-block" href="#/order/' + encodeURIComponent(o.id) + '">Open my order</a>' : '<a class="btn btn-ghost btn-block" href="#/login?next=' + encodeURIComponent('order/' + o.id) + '">Sign in to see everything</a>';
  return '<div class="trk"><div class="ord-head"><div><h2>Order ' + esc(o.id) + '</h2><p class="meta">Placed ' + esc(fmtDate(o.createdAt)) + (s.city || s.country ? ' · Delivering to ' + esc([s.city, s.country].filter(Boolean).join(', ')) : '') + '</p></div><div class="pills">' + payPill(o) + deliveryPill(o) + '</div></div>' +
    '<div class="alert ' + n.kind + '" role="status">' + esc(n.text) + '</div>' + progressCard(o) +
    (items ? '<section class="card"><h2>Items</h2><ul class="olist">' + items + '</ul></section>' : '') + '<div style="margin-top:16px">' + open + '</div></div>';
}

function renderNotes() {

  if (!l.length) { view('<div class="wrap page"><h1>Notifications</h1><div class="empty"><h2>Nothing new</h2><p>We tell you here when your payment is confirmed, your order is on its way, or we reply to you.</p><a class="btn" href="#/shop">Back to shop</a></div></div>'); return; }
  view('<div class="wrap page"><div class="ord-head"><h1>Notifications</h1>' + (unread ? '<button type="button" class="btn btn-ghost btn-sm" data-act="nall">Mark all as read</button>' : '') + '</div>' +

App.actions.nopen = async el => {
  const n = NT.list.find(x => String(x.id) === el.dataset.id); if (!n) return;
  if (!n.read) {
    n.read = true; App.unread = Math.max(0, (App.unread || 0) - 1); App.updateTools();
    api('markRead', { ids: [n.id] }).then(r => { if (r && typeof r.unread === 'number') { App.unread = r.unread; App.updateTools(); } }).catch(() => { /* it is only a bonus */ });
  }
  if (n.orderId) go('order/' + encodeURIComponent(n.orderId)); else renderNotes();
};
App.actions.nall = async el => {
  try {
    const r = await busy(el, 'Saving…', () => api('markRead', { all: true }));
    NT.list.forEach(n => { n.read = true; }); App.unread = r.unread || 0; App.updateTools(); renderNotes();
  } catch (e) { handleErr(e, 'notifications'); }
};

/* ---------- details ---------- */
async function saveProfile(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f); clearErrors(f); showAlert('pf-alert', '');
  const d = { name: val('pf-name'), phone: val('pf-phone'), country: val('pf-country'), city: val('pf-city'), address: val('pf-address') }; let bad = false;
  if (!d.name) { fieldError('pf-name', 'Please tell us your name.'); bad = true; }
  if (d.phone && d.phone.replace(/\D/g, '').length < 7) { fieldError('pf-phone', 'That phone number looks too short.'); bad = true; }
  if (bad) return focusFirstBad(f);
  try {
    const r = await busy(btn, 'Saving…', () => api('updateProfile', d));
    App.user = r.customer; store('gbs_user', r.customer); App.updateTools();
    const n = $('#acc-name'); if (n) n.textContent = r.customer.name || 'Your name';
    toast('Your details are saved.');
  } catch (e) { if (e.code === 'AUTH') handleErr(e, 'account'); else showAlert('pf-alert', e.message); }
}

/* ---------- photo ---------- */
App.actions.apick = () => { const i = $('#acc-photo'); if (i) i.click(); };
async function pickPhoto(ev) {
  const inp = ev.target, file = inp.files && inp.files[0]; if (!file) return;
  showAlert('ph-alert', '');
  try {
    const data = await resizeImage(file, 480, 400 * 1024, 0.85);
    const r = await api('updateProfile', { photoDataUrl: data });

  } catch (e) { if (e.code === 'AUTH') handleErr(e, 'account'); else showAlert('ph-alert', e.message); }

}

/* ---------- password ---------- */
function pwCardHtml() {
  if (!App.user.hasPassword) {
    return '<h2>Password</h2><p class="meta">Right now you sign in with a code we email you. Add a password if you want to sign in faster.</p><div id="pw-alert"></div><form id="pw-form" novalidate>' +
      fld('pw-new', 'New password', { pw: 1, ac: 'new-password', req: 1, hint: 'At least 8 characters.' }) + '<button class="btn btn-block" type="submit">Save password</button></form>';
  }
  return '<h2>Password</h2><div id="pw-alert"></div><form id="pw-form" novalidate>' + fld('pw-cur', 'Current password', { pw: 1, ac: 'current-password', req: 1 }) +
    fld('pw-new', 'New password', { pw: 1, ac: 'new-password', req: 1, hint: 'At least 8 characters.' }) + '<button class="btn btn-block" type="submit">Change password</button></form>' +
    '<p class="meta" style="margin:12px 0 0"><button type="button" class="linkbtn" data-act="pwremove">Remove my password</button>. You can still sign in with a code we email you.</p>';

function bindPw() { const f = $('#pw-form'); if (f) f.addEventListener('submit', savePassword); }
async function savePassword(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f), has = App.user.hasPassword; clearErrors(f); showAlert('pw-alert', '');
  const cur = has ? $('#pw-cur').value : '', pw = $('#pw-new').value; let bad = false;
  if (has && !cur) { fieldError('pw-cur', 'Please type your current password.'); bad = true; }
  if (pw.length < 8) { fieldError('pw-new', 'Your new password needs at least 8 characters.'); bad = true; }
  if (bad) return focusFirstBad(f);
  try {
    await busy(btn, 'Saving…', () => api('setPassword', has ? { password: pw, current: cur } : { password: pw }));
    App.user.hasPassword = true; store('gbs_user', App.user);
    $('#pw-card').innerHTML = pwCardHtml(); bindPw(); toast(has ? 'Your password was changed.' : 'Your password is saved.');
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'account');
    if (has && /current/i.test(e.message)) fieldError('pw-cur', e.message); else showAlert('pw-alert', e.message);
  }
}
App.actions.pwremove = () => {
  openModal('Remove your password', '<form id="rm-form" novalidate><div id="rm-alert"></div><p class="meta">After this you sign in with a code we email you.</p>' + fld('rm-cur', 'Current password', { pw: 1, ac: 'current-password', req: 1 }) +
    '<button class="btn btn-block" type="submit">Remove password</button></form>',
    () => $('#rm-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const f = ev.target, btn = $('button[type=submit]', f); clearErrors(f); showAlert('rm-alert', '');
      const cur = $('#rm-cur').value; if (!cur) { fieldError('rm-cur', 'Please type your current password.'); return focusFirstBad(f); }
      try {
        await busy(btn, 'Removing…', () => api('removePassword', { current: cur }));
        App.user.hasPassword = false; store('gbs_user', App.user); closeModal();
        const c = $('#pw-card'); if (c) { c.innerHTML = pwCardHtml(); bindPw(); } toast('Your password was removed.');
      } catch (e) { if (e.code === 'AUTH') { closeModal(); handleErr(e, 'account'); } else showAlert('rm-alert', e.message); }
    }));
};

/* ---------- messages ---------- */
function msgCardHtml() {
  const t = ACC.tickets;
  let h = '<h2>My messages</h2>';
  if (t === null) h += '<p class="meta">We could not load your messages. <button type="button" class="linkbtn" data-act="reloadMessages">Try again</button></p>';

App.loc = store('gbs_loc') || null;           // {code, country, city, lat, lng, manual}

const LOC = { seq: 0, timer: null, hits: [] };

function locLabel() {

}
function localeBarHtml() {

    (typeof langBarHtml === 'function' ? langBarHtml() : '');
}

// the guess from the internet address, filled in once it has been found (never replaces a place the customer chose)
App.onDetected = function () {
  if (App.loc && App.loc.manual) { renderTopbar(); return; }
  const c = countryByCode(App.fx.country); if (!c) { renderTopbar(); return; }
  const ip = App.ipInfo && App.ipInfo.code === c.code ? App.ipInfo : {};
  App.loc = { code: c.code, country: c.name, city: ip.city || '', lat: ip.lat == null ? null : ip.lat, lng: ip.lng == null ? null : ip.lng, manual: false };
  store('gbs_loc', App.loc); renderTopbar();
};

function setLocation(l) {
  const c = countryByCode(l.code); if (!c) return;
  App.loc = { code: c.code, country: c.name, city: l.city || '', lat: l.lat == null ? null : Number(l.lat), lng: l.lng == null ? null : Number(l.lng), manual: true };
  store('gbs_loc', App.loc);
  App.fx.country = c.code;
  const cur = CUR_MAP[c.code];
  if (cur && App.fx.rates && App.fx.rates[cur]) { App.fx.auto = true; applyCurrency(cur); }   // the currency follows the place
  store('gbs_cur', { code: App.fx.code, auto: App.fx.auto, country: App.fx.country });

function locResults(text) {
  const box = $('#loc-res'); if (!box) return;
  const t = norm(text).trim();
  if (!t) {
    box.innerHTML = '<p class="loc-h">Popular places</p><div class="loc-chips">' + POPULAR_PLACES.map(code => { const c = countryByCode(code); return c ? '<button type="button" class="chip" data-act="locpick" data-code="' + code + '">' + esc(c.name) + '</button>' : ''; }).join('') + '</div>';
    return;
  }
  const hits = countryList().filter(c => norm(c.name).indexOf(t) >= 0 || c.code.toLowerCase() === t).sort((a, b) => (norm(a.name).indexOf(t) === 0 ? 0 : 1) - (norm(b.name).indexOf(t) === 0 ? 0 : 1)).slice(0, 8);
  box.innerHTML = (hits.length ? '<p class="loc-h">Countries</p><ul class="loc-list">' + hits.map(c => '<li><button type="button" data-act="locpick" data-code="' + c.code + '">' + ico('pin') + '<span>' + esc(c.name) + '</span></button></li>').join('') + '</ul>' : '') +
    '<div id="loc-places"></div>';
  if (!hits.length) $('#loc-places').innerHTML = t.length < 3 ? '<p class="meta">Keep typing…</p>' : '';
}
async function locPlaces(text) {
  const t = String(text || '').trim(), box = $('#loc-places'); if (!box) return;
  if (t.length < 3) { box.innerHTML = ''; return; }
  const my = ++LOC.seq; box.innerHTML = '<p class="meta">Searching places…</p>';
  try {
    const r = await nominatim('search', { q: t, limit: 6 });
    if (my !== LOC.seq || !$('#loc-places')) return;
    LOC.hits = (Array.isArray(r) ? r : []).filter(x => x.address && countryByCode(x.address.country_code));
    $('#loc-places').innerHTML = LOC.hits.length ? '<p class="loc-h">Cities and places</p><ul class="loc-list">' + LOC.hits.map((x, i) => '<li><button type="button" data-act="locplace" data-i="' + i + '">' + ico('pin') + '<span>' + esc(String(x.display_name).split(',').slice(0, 3).join(',')) + '<small>' + esc(x.address.country || '') + '</small></span></button></li>').join('') + '</ul>' : '<p class="meta">No city found for that. Try a country name or tap a popular place.</p>';
  } catch (e) { if (my === LOC.seq && $('#loc-places')) $('#loc-places').innerHTML = '<p class="meta">Place search is not available right now. You can still pick a country.</p>'; }
}
function cityOf(a) { return a.city || a.town || a.village || a.municipality || a.suburb || a.county || a.state || ''; }
App.actions.locpick = el => setLocation({ code: el.dataset.code });
App.actions.locplace = el => {
  const x = LOC.hits[Number(el.dataset.i)]; if (!x) return;
  setLocation({ code: x.address.country_code, city: cityOf(x.address), lat: x.lat, lng: x.lon });
};

/* use the phone's own location */
App.actions.locgeo = el => {
  showAlert('loc-alert', '');
  if (!navigator.geolocation) return showAlert('loc-alert', 'This browser cannot share your location. Please search for your place instead.');
  const old = el.innerHTML; el.disabled = true; el.textContent = 'Finding you…';
  const done = () => { el.disabled = false; el.innerHTML = old; };
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    try {
      const r = await nominatim('reverse', { lat: lat, lon: lng, zoom: 12 });
      if (r && r.address && countryByCode(r.address.country_code)) return setLocation({ code: r.address.country_code, city: cityOf(r.address), lat: lat, lng: lng });
      throw new Error('no place');
    } catch (e) { done(); showAlert('loc-alert', 'We found you, but could not tell the place name. Please search for your city instead.'); }
  }, err => {
    done();
    showAlert('loc-alert', err && err.code === 1 ? 'Location is blocked for this website. Allow it in your browser settings, or search for your place below.' : 'We could not find your position. Please search for your place below.', 'warn');
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
};

/* ---------- the translator (loaded only when a visitor picks a language) ---------- */
function loadTranslator() {
  if (GT.promise) return GT.promise;
  GT.promise = new Promise((ok, bad) => {
    let host = $('#gt-el'); if (!host) { host = document.createElement('div'); host.id = 'gt-el'; host.className = 'gt-hidden'; document.body.appendChild(host); }
    window.__gtInit = () => { try { new window.google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'gt-el'); ok(); } catch (e) { bad(e); } };
    loadScript('https://translate.google.com/translate_a/element.js?cb=__gtInit').catch(bad);
    setTimeout(() => bad(new Error('timeout')), 15000);
  }).catch(e => { GT.promise = null; throw e; });
  return GT.promise;
}
function gtCombo() { return document.querySelector('select.goog-te-combo'); }
function waitCombo() {
  return new Promise((ok, bad) => {
    let n = 0; const t = setInterval(() => { const c = gtCombo(); if (c && c.options.length > 1) { clearInterval(t); ok(c); } else if (++n > 60) { clearInterval(t); bad(new Error('timeout')); } }, 150);
  });
}
async function gtSet(code) {
  await loadTranslator(); const c = await waitCombo();
  if (![].some.call(c.options, o => o.value === code)) throw new Error('unsupported');
  c.value = code; c.dispatchEvent(new Event('change'));
}

  const box = $('#lang-res'); if (!box) return;
  const t = norm(text).trim();
  if (!t) {
    box.innerHTML = '<p class="loc-h">Popular languages</p><ul class="loc-list cols">' + POPULAR_LANGS.map(c => langRow(langInfo(c))).join('') + '</ul><p class="loc-h">All languages</p><p class="meta">Type a name above to find it quickly.</p>';
    return;
  }
  const hits = LANGS.filter(l => norm(l[1]).indexOf(t) >= 0 || norm(l[2]).indexOf(t) >= 0 || l[0].toLowerCase() === t).slice(0, 12);
  box.innerHTML = hits.length ? '<ul class="loc-list">' + hits.map(langRow).join('') + '</ul>' : '<p class="meta">No language found for that. Try the English name, for example "Swahili".</p>';
}

App.actions.langpick = async el => {
  const code = el.dataset.code, l = langInfo(code);
  if (code === App.lang.code) { closeModal(); return; }
  if (code === 'en') { App.lang = { code: 'en' }; store('gbs_lang', App.lang); clearGoogCookie(); location.reload(); return; }   // a fresh start gives back the original English page
  const old = el.innerHTML; el.disabled = true; el.querySelector('b').textContent = 'Please wait…';
  try { await gtSet(code); }
  catch (e) {
    el.disabled = false; el.innerHTML = old;
    return showAlert('lang-alert', e.message === 'unsupported' ? 'The translator does not have ' + l[1] + ' yet. Please choose another language.' : 'The translator could not start. Please check your internet connection and try again.');
  }
  App.lang = { code: code }; store('gbs_lang', App.lang); document.documentElement.lang = code;
  closeModal(); renderTopbar();
};

// a language chosen on an earlier visit is switched on again after the page opens
(function restoreLang() {
  if (!App.lang || App.lang.code === 'en') return;
  const code = App.lang.code; document.documentElement.lang = code;
  gtSet(code).catch(() => { App.lang = { code: 'en' }; store('gbs_lang', App.lang); document.documentElement.lang = 'en'; if (typeof renderTopbar === 'function' && $('#topbar')) renderTopbar(); });
})();

/* =====================================================================
   Receipt  #/receipt/ORD-1001
   A clean, printable receipt for a paid order. It is built from the order data the shop already has,
   so nothing new is stored or sent anywhere. Print it, or choose "Save as PDF" in the print window.
   ===================================================================== */
App.keepOnRefresh.receipt = true;
const RC = { id: '' };
function hasReceipt(o) { return !!o && !!o.paidAt && (o.paymentStatus === 'Paid' || o.paymentStatus === 'Refunded'); }
function rcHere() { return App.route && App.route.seg[0] === 'receipt' && String(App.route.seg[1] || '').toUpperCase() === RC.id; }

App.routes.receipt = async function (rest) {
  const id = String(rest[0] || '').toUpperCase();
  setTitle('Receipt ' + id);
  if (!requireLogin('receipt/' + id)) return;
  RC.id = id;
  const c = App.orderCache[id];
  if (c && Date.now() - c.t < 20000) { showReceipt(c.order); return; }
  view('<div class="wrap page"><div class="skel ln" style="height:34px;width:50%"></div><div class="skel sq" style="margin-top:16px;aspect-ratio:3/2"></div></div>');
  try {
    const r = await api('myOrders');
    if (!rcHere()) return;
    const o = (r.orders || []).find(x => String(x.id).toUpperCase() === id);
    if (!o) { view('<div class="wrap page"><div class="err-box"><h2>We could not find that order</h2><p>Please check the order number, or look in your orders list.</p><a class="btn" href="#/orders">My orders</a></div></div>'); return; }
    App.orderCache[o.id] = { order: o, t: Date.now() };
    showReceipt(o);
  } catch (e) {
    if (e.code === 'AUTH') return handleErr(e, 'receipt/' + id);
    if (rcHere()) view('<div class="wrap page">' + errorBox(e.message || 'We could not load your receipt.', true) + '</div>');
  }
};

/* the round company seal with the PAID (or REFUNDED) mark across it - drawn as a picture so it prints sharply and needs no file */
function rcSeal(name, year, refunded, dateTxt, orderId) {
  const nm = String(name || '').toUpperCase().slice(0, 36), fs = Math.max(12, Math.min(23, Math.floor(23 * 24 / Math.max(nm.length, 12))));
  const bot = (year ? 'SINCE ' + year + ' · ' : '') + 'WORLDWIDE TRADE', ink = refunded ? '#c0561b' : '#1a8a3a', word = refunded ? 'REFUNDED' : 'PAID';
  const sub = String(dateTxt || '').toUpperCase() + (orderId ? ' · ' + String(orderId).slice(0, 14) : '');
  return '<div class="rc-stamp rc-seal' + (refunded ? ' ref' : '') + '"><svg viewBox="0 0 330 330" aria-hidden="true" focusable="false"><defs><path id="rcsT" d="M 47 165 A 118 118 0 1 1 283 165 A 118 118 0 1 1 47 165"/><path id="rcsB" d="M 40 165 A 125 125 0 1 0 290 165 A 125 125 0 1 0 40 165"/></defs>' +
    '<g transform="rotate(-6 165 165)"><g fill="#12306B" stroke="#12306B"><circle cx="165" cy="165" r="150" fill="none" stroke-width="7"/><circle cx="165" cy="165" r="141" fill="none" stroke-width="2"/>' +
    '<text font-size="' + fs + '" font-weight="800" letter-spacing="1" stroke="none" text-anchor="middle"><textPath href="#rcsT" startOffset="25%">' + esc(nm) + '</textPath></text>' +
    '<text font-size="15" font-weight="700" letter-spacing="2" stroke="none" text-anchor="middle"><textPath href="#rcsB" startOffset="25%">' + esc(bot) + '</textPath></text>' +
    '<text x="165" y="112" font-size="22" font-weight="800" stroke="none" text-anchor="middle">★ ★ ★</text></g>' +
    '<g transform="rotate(-10 165 175)" fill="none"><rect x="52" y="132" width="226" height="76" rx="10" stroke="' + ink + '" stroke-width="6" fill="rgba(255,255,255,.6)"/>' +
    '<text x="165" y="' + (refunded ? 180 : 186) + '" font-size="' + (refunded ? 36 : 52) + '" font-weight="900" letter-spacing="' + (refunded ? 2 : 4) + '" fill="' + ink + '" text-anchor="middle">' + word + '</text>' +
    '<text x="165" y="203" font-size="11" font-weight="700" fill="' + ink + '" text-anchor="middle" letter-spacing="1">' + esc(sub) + '</text></g></g></svg><span class="rc-sr">' + word + '</span></div>';
}
function showReceipt(o) {
  if (!rcHere()) return;
  if (!hasReceipt(o)) {
    view('<div class="wrap page"><a class="back" href="#/order/' + encodeURIComponent(o.id) + '">← Back to order</a><div class="empty"><h2>No receipt yet</h2><p>A receipt is ready as soon as the payment for this order is confirmed.</p><a class="btn" href="#/order/' + encodeURIComponent(o.id) + '">Open my order</a></div></div>');
    return;
  }
  const s = o.ship || {}, logo = safeUrl(setting('logoUrl', '')), mail = setting('supportEmail', ''), refunded = o.paymentStatus === 'Refunded';
  // a receipt shows what was really paid: shillings for M-Pesa (and a bank in shillings), US dollars for PayPal and cards
  const mpesa = o.paymentMethod === 'M-Pesa', payCur = orderPayCur(o);
  const amt = v => orderPayText(o, v);
  const rows = (o.items || []).map(i => '<li><span class="nm">' + esc(i.name) + '<small>' + esc(i.qty) + ' × ' + esc(amt(i.price)) + '</small></span><span class="amt">' + esc(amt(i.price * i.qty)) + '</span></li>').join('');
  const d = o.display || {};   // when the customer saw another currency in the shop, say what it was
  const seen = (mpesa ? '<p class="meta rc-fx">Paid by M-Pesa. Your M-Pesa message shows the exact amount.</p>' : '') + (d.currency && d.currency !== payCur && d.total ? '<p class="meta rc-fx">The shop showed ' + esc(money2(d.currency, d.total)) + ' at the time.</p>' : '');
  const meta = (k, v) => v ? '<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>' : '';
  const stamp = esc(fmtDate(new Date().toISOString(), { day: 'numeric', month: 'long', year: 'numeric' }));
  view('<div class="wrap page rc-page"><a class="back rc-noprint" href="#/order/' + encodeURIComponent(o.id) + '">← Back to order</a>' +
    '<article class="rc" aria-label="Receipt for order ' + esc(o.id) + '">' +
    '<header class="rc-head"><div class="rc-brand">' + (logo ? '<img src="' + esc(logo) + '" alt="' + esc(bizName()) + '">' : '<b>' + esc(bizName()) + '</b>') + '<small>Since ' + esc(setting('foundedYear', '2018')) + (mail ? ' · ' + esc(mail) : '') + '</small></div>' +
    '<div class="rc-title"><h1>Receipt</h1>' + rcSeal(bizName(), setting('foundedYear', ''), refunded, fmtDate(o.paidAt || o.createdAt, { day: 'numeric', month: 'short', year: 'numeric' }), o.id) + '</div></header>' +
    '<dl class="rc-meta">' + meta('Order number', o.id) + meta('Order date', fmtDate(o.createdAt, { day: 'numeric', month: 'short', year: 'numeric' })) + meta('Paid on', fmtDate(o.paidAt)) +
    meta('Payment method', o.paymentMethod) + meta('Payment reference', o.paymentRef) + '</dl>' +
    '<section class="rc-sec"><h2>Delivered to</h2><p class="addr"><b>' + esc(s.name) + '</b><br>' + (s.address ? esc(s.address) + '<br>' : '') + esc([s.city, s.country].filter(Boolean).join(', ')) + (s.phone ? '<br>' + esc(s.phone) : '') + (s.email ? '<br>' + esc(s.email) : '') + '</p></section>' +
    '<section class="rc-sec"><h2>Items</h2><ul class="rc-items">' + rows + '</ul>' +
    '<div class="rc-line"><span>Delivery</span><span>Free</span></div><div class="rc-line rc-total"><span>Total paid</span><span>' + esc(payCur === 'USD' ? usd(o.total) + ' USD' : orderPayText(o, o.total)) + '</span></div>' + seen + '</section>' +
    '<footer class="rc-foot"><p>Thank you for shopping with ' + esc(bizName()) + '.' + (mail ? ' Questions? Write to ' + esc(mail) + '.' : '') + '</p><p class="meta">Receipt made on ' + stamp + ' from our order records. Keep it for your records.</p></footer></article>' +
    '<div class="rc-actions rc-noprint"><button type="button" class="btn btn-tape" data-act="rprint">Print or save as PDF</button><a class="btn btn-ghost" href="#/orders">My orders</a></div>' +
    '<p class="meta rc-noprint rc-tip">To keep a copy on your phone, tap Print, then choose "Save as PDF" as the printer.</p></div>');
}
App.actions.rprint = () => { try { window.print(); } catch (e) { toast('Printing is not available here.', 'err'); } };

/* ---------- start ---------- */
const PAGES_WITH_CATALOG = ['', 'home', 'shop', 'p', 'cart'];
function ready() { renderChrome(); onRoute(false); }
async function boot() {
  psReturnFromUrl(); loadCart(); restoreCurrency(); App.token = store('gbs_token'); App.user = store('gbs_user');
  const cached = store('gbs_cat');
  if (cached && cached.cfg && cached.cfg.settings) { App.cfg = cached.cfg; App.products = cached.products || []; cleanCart(); ready(); }
  try {
    const fresh = await fetchCatalog();
    const changed = !cached || JSON.stringify(fresh) !== JSON.stringify({ cfg: cached.cfg, products: cached.products });
    App.cfg = fresh.cfg; App.products = fresh.products; store('gbs_cat', fresh); cleanCart();
    const fxBefore = App.fx.code + App.fx.rate; if (App.fx.code === 'KES') applyCurrency('KES'); const fxChanged = fxBefore !== App.fx.code + App.fx.rate;   // the shop's shilling rate may have changed
    if (!cached || !cached.cfg) ready();
    else if (changed || fxChanged) { renderChrome(); if (PAGES_WITH_CATALOG.indexOf(App.route.seg[0] || '') !== -1) onRoute(true); else if (App.route.seg[0] === 'checkout' && App.refreshPayMethods) App.refreshPayMethods(); }
  } catch (e) {
    if (!App.cfg) view('<div class="wrap">' + errorBox(e.message, true) + '</div>');
  }
  if (App.cfg) { loadSession(); initCurrency(); }
}
boot();
